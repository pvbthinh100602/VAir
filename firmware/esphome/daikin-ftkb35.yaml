# ESPHome control firmware for the Daikin FTKB35, remote ARC486A56.
#
# Captures on 2026-11-03 confirmed the standard 3-frame Daikin layout
# (8 + 8 + 19 bytes), not DAIKIN216. The bytes differ from ESPHome's
# built-in daikin sender, so this file uses the local daikin_ftkb platform.
#
# Confirmed from the remote:
#   Power bit, Cool (0x30), Fan-only (0x60), temperature in 0.5 C steps,
#   fan level 3 (0x50), level 4 (0x60), level 5 (0x70), auto (0xA0),
#   night/sleep (0xB0), and vertical swing.
# Not confirmed on this remote:
#   Dry, fan level 1, and the 10-30 C ends.
# Transmission to the indoor unit has not been tested.
#
# IR LED signal pin is GPIO13.
# This image does not read IR. Frame capture is firmware/esphome/ir-capture.yaml.
# Commands are typed on the USB serial port. See the firmware README.

esphome:
  name: daikin-ftkb35
  friendly_name: Daikin FTKB35

esp32:
  board: esp32dev
  framework:
    type: arduino

external_components:
  - source:
      type: local
      path: components

logger:
  level: INFO

api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Daikin-FTKB35 Fallback"
    password: !secret ap_password

captive_portal:

remote_transmitter:
  id: ir_tx
  pin: GPIO13
  carrier_duty_percent: 50%
  non_blocking: false

climate:
  - platform: daikin_ftkb
    name: "Daikin FTKB35 Air Conditioner"
    transmitter_id: ir_tx
    supports_heat: false
    supports_heat_cool: false
