# ESPHome Secrets Configuration Example
# Copy this file to secrets.yaml and fill in your actual values
# IMPORTANT: secrets.yaml is in .gitignore and should NEVER be committed to git

# WiFi Configuration
wifi_ssid: "YourWiFiSSID"
wifi_password: "YourWiFiPassword"

# Fallback Access Point Password (when WiFi fails to connect)
ap_password: "fallback-ap-password"

# API Encryption Key (generate with: esphome config daikin-ftkb35.yaml)
api_encryption_key: "your-32-character-encryption-key-here"

# Notes:
# - Generate API encryption key by running: esphome config daikin-ftkb35.yaml
#   ESPHome will suggest a random key if one is not found.
# - Keep this file secure and never share it publicly.
# - Use strong passwords for WiFi and AP access.
